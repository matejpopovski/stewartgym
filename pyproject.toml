[project]
name = "stewartgym"
version = "0.1.0"
description = "PPO with domain randomization against a tuned cascaded PID on a simulated Stewart platform balancing a ball."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "torch>=2.5,<3",
    "matplotlib>=3.9,<4",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stewartgym"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "render: needs an off-screen OpenGL context",
    "slow: longer physics runs, still under a minute",
]
